name: ZVB Radar 24/7 Live Scanner

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: zvb-radar-scanner
  cancel-in-progress: true

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git for History Sync
        run: |
          git config user.name "ZVB Radar Bot"
          git config user.email "bot@zvb.bg"

      - name: Create config.json from Secret
        run: |
          echo "$CONFIG_JSON" > config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Run ZVB Multi-Engine Radar v3.0
        run: |
          python lead_scraper.py
